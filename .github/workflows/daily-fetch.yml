# Fallback scheduler for the daily fetch, in case Vercel Cron misbehaves.
#
# Vercel Cron is the primary scheduler (frontend/vercel.json). This workflow calls the
# same routes and only runs when started by hand from the Actions tab. To make it the
# scheduler, uncomment `schedule` below and remove the crons from frontend/vercel.json,
# so each run happens once.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SITE_URL     the production URL, e.g. https://updates-is-all-you-need.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
name: Daily fetch (fallback)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * *"

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch sources
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/fetch"
      - name: AI summaries (skipped by the site when ANTHROPIC_API_KEY is not set)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/enrich"
